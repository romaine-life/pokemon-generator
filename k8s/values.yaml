# The image by tag and digest, rewritten by the suite's pin PR on each release. The first
# release's pin PR replaces this placeholder, which names no image.
image: romainecr.azurecr.io/pokemon-generator:v0.1.1@sha256:eac875fa99127e2f8c6e042ae99b62d866265fa00fcc85fe7b76ff2e6f15ae76
imagePullPolicy: IfNotPresent

replicas: 2

publicUrl: https://pokemon-generator.romaine.life

service:
  port: 80
  targetPort: http

container:
  port: 8080

# Generating a creature takes a few milliseconds of CPU; the API's answers are cached by
# browsers, so this is generous.
resources:
  requests:
    cpu: 10m
    memory: 24Mi
  limits:
    cpu: 250m
    memory: 96Mi

gateway:
  hostname: pokemon-generator.romaine.life
  parentGateway:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: main
    namespace: envoy-gateway-system
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
