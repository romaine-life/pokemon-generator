# The app's HTTPS listener, attached cross-namespace to the shared Gateway (standard
# Gateway API ListenerSet, gateway.networking.k8s.io/v1).
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: pokemon-generator
  namespace: {{ .Release.Namespace }}
spec:
  parentRef:
    group: {{ .Values.gateway.parentGateway.group | quote }}
    kind: {{ .Values.gateway.parentGateway.kind | quote }}
    name: {{ .Values.gateway.parentGateway.name | quote }}
    namespace: {{ .Values.gateway.parentGateway.namespace | quote }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gateway.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: pokemon-generator-tls
