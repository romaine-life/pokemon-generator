# The same HTTPS listener as a standard ListenerSet (AUT-13). Envoy Gateway v1.7.2 reads
# only XListenerSet and v1.8+ only ListenerSet, so both carry it until the gateway's
# upgrade, after which the XListenerSet is removed.
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: pokemon-generator
  namespace: {{ .Release.Namespace }}
spec:
  parentRef:
    group: {{ .Values.gateway.parentGateway.group | quote }}
    kind: {{ .Values.gateway.parentGateway.kind | quote }}
    name: {{ .Values.gateway.parentGateway.name | quote }}
    namespace: {{ .Values.gateway.parentGateway.namespace | quote }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gateway.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: pokemon-generator-tls
